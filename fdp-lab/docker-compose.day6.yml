# FDP Big Data Lab - Day 6 Dedicated Environment
# Profile: ELK Stack + Kafka + Spark MLlib Mini Project
# Target RAM budget: ~3.2 GB (Safe for 8 GB & 16 GB host PCs)
# Startup: docker compose -f docker-compose.day6.yml up -d
# Shutdown: docker compose -f docker-compose.day6.yml stop

name: fdp-bigdata-day6

services:
  lab:
    build: ./lab
    container_name: lab
    ports: ["8888:8888", "4040:4040"]
    volumes: ["./notebooks:/workspace"]
    environment:
      - SPARK_LOCAL_IP=lab
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    ports: ["5601:5601"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on: [elasticsearch]
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: logstash
    environment:
      LS_JAVA_OPTS: -Xms384m -Xmx384m
      XPACK_MONITORING_ENABLED: "false"
    volumes: ["./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf"]
    depends_on: [elasticsearch, kafka]
    restart: unless-stopped
