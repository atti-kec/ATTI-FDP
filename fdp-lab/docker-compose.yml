# FDP Big Data Lab: one file, one command per day.
# Day 1-3: docker compose --profile hadoop up -d      (HDFS + Hive + MySQL)
# Day 4-5: docker compose --profile streaming up -d   (Kafka)
# Day 6  : docker compose --profile day6 up -d        (Kafka + ELK + Spark ML, ~3.2 GB RAM)
# All    : docker compose --profile all up -d         (everything, needs ~8 GB RAM for Docker)
# Jupyter + Spark + MLlib (service "lab") always starts.
name: fdp-bigdata

services:
  lab:
    build: ./lab
    container_name: lab
    ports: ["8888:8888", "4040:4040"]
    volumes: ["./notebooks:/workspace"]

  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    profiles: [hadoop, all]
    command: ["hdfs", "namenode"]
    ports: ["9870:9870"]
    env_file: ./hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name

  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    profiles: [hadoop, all]
    command: ["hdfs", "datanode"]
    env_file: ./hadoop.env
    depends_on: [namenode]

  hive:
    image: apache/hive:4.0.0
    container_name: hive
    profiles: [hadoop, all]
    ports: ["10000:10000", "10002:10002"]
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dfs.defaultFS=hdfs://namenode:8020
        -Dhive.metastore.warehouse.dir=hdfs://namenode:8020/user/hive/warehouse
    depends_on: [namenode, datanode]

  mysql:
    image: mysql:8.0
    container_name: mysql
    profiles: [hadoop, all]
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ev
    volumes: ["./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql"]

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    profiles: [streaming, day6, all]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    profiles: [elk, day6, all]
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    profiles: [elk, day6, all]
    ports: ["5601:5601"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on: [elasticsearch]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: logstash
    profiles: [day6, all]
    environment:
      LS_JAVA_OPTS: -Xms384m -Xmx384m
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./logstash/station_alerts_template.json:/usr/share/logstash/templates/station_alerts_template.json:ro
    depends_on: [elasticsearch, kafka]
